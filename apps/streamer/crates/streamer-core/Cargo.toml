[package]
name = "streamer-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
opus = "=0.4.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "json"] }
rtrb = "0.4.1"
clap = { version = "4.6.8", features = ["derive"] }
dirs = "7.0.0"
uuid = { version = "1.29.3", features = ["v4"] }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "isomp4", "alac", "flac", "wav", "pcm", "ogg", "vorbis", "mkv", "id3v2"] }
symphonia-adapter-libopus = "0.3.0"
rubato = "5.1.0"

[target.'cfg(target_os = "linux")'.dependencies]
# v1_0_0: the oldest PipeWire the app supports (audio::apps::check_versions). The bindings
# come from the PipeWire headers of the build system, and the Linux bundles are built
# on Ubuntu 24.04 (PipeWire 1.0, see packaging/linux/Dockerfile).
pipewire = { version = "0.10.1", features = ["v1_0_0"] }
