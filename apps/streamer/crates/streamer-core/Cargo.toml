[package]
name = "streamer-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
opus = "=0.4.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"
rtrb = "0.4.1"
clap = { version = "4.6.8", features = ["derive"] }
dirs = "7.0.0"
uuid = { version = "1.29.3", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", features = ["v1_2_0"] }
